<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123b70">
  <title>PakKom Exambro V20.1.4</title>
  <link rel="stylesheet" href="style.css?v=20.1.4">
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-card">
      <div class="boot-logo">P</div>
      <h2>PakKom Exambro</h2>
      <p class="muted">Memuat aplikasi…</p>
    </div>
  </div>
  <div id="app"></div>

  <script>
    // Safe default: bootstrap may only start after core.js explicitly sets this true.
    window.PAKKOM_BOOT_OK=false;
    window.PAKKOM_MODULES=[];
    window.PAKKOM_BOOT_ERROR=function(msg){
      var b=document.getElementById('boot');
      if(b){
        b.classList.remove('hide');
        b.innerHTML='<div class="boot-card"><h2>Aplikasi tidak dapat dimuat</h2><div class="error">'+String(msg).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</div><p class="muted">Coba muat ulang halaman. Jika tetap gagal, periksa config.js, koneksi internet, Firebase Authentication, dan Firestore Rules.</p></div>';
      }
    };
    window.addEventListener('error',function(e){
      if(e && e.message) window.PAKKOM_BOOT_ERROR(e.message);
    });
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js?v=20.1.4"></script>
  <script src="js/core/core.js?v=20.1.4"></script>
  <script src="js/student/student.js?v=20.1.4"></script>
  <script src="js/admin/dashboard.js?v=20.1.4"></script>
  <script src="js/admin/people.js?v=20.1.4"></script>
  <script src="js/admin/exams.js?v=20.1.4"></script>
  <script src="js/admin/scores.js?v=20.1.4"></script>
  <script src="js/admin/question-bank.js?v=20.1.4"></script>
  <script src="js/bootstrap.js?v=20.1.4"></script>
  <script>
    // Helpful diagnostic if GitHub Pages has not propagated every modular file yet.
    window.setTimeout(function(){
      if(window.PAKKOM_BOOT_OK!==true && window.PAKKOM_BOOT_ERROR){
        window.PAKKOM_BOOT_ERROR('Core aplikasi belum siap. Pastikan folder js/core, js/student, dan js/admin ikut terunggah ke GitHub, lalu lakukan refresh paksa.');
      }
    },3500);
  </script>
</body>
</html>
