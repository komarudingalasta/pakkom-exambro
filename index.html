<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b70">
<title>PakKom Exambro V11.1.1 Fix</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f9;color:#172033}.boot{max-width:500px;margin:9vh auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(16,42,67,.10)}.boot h1{margin:0 0 8px;color:#123b70}.boot p{line-height:1.5}.boot-status{background:#eef6ff;border-radius:10px;padding:12px;margin-top:14px;color:#315a82}.boot-error{background:#fff1f1;color:#a61b1b}.hide{display:none!important}
</style>
<link rel="stylesheet" href="style.css">
<script>
window.PAKKOM_BOOT_ERROR=function(msg){var b=document.getElementById('boot');var s=document.getElementById('bootStatus');if(b){b.className='boot';}if(s){s.className='boot-status boot-error';s.textContent=msg||'Aplikasi gagal dimuat.';}};
window.onerror=function(message,source,line,col){window.PAKKOM_BOOT_ERROR('Terjadi error aplikasi: '+message+' (baris '+line+').');};
setTimeout(function(){var app=document.getElementById('app');var boot=document.getElementById('boot');if(boot && !boot.classList.contains('hide') && (!app || !app.innerHTML.trim())){var s=document.getElementById('bootStatus');if(s){s.className='boot-status boot-error';s.textContent='Aplikasi belum berhasil dimuat. Periksa koneksi internet, config.js, dan Firebase.';} }},12000);
</script>
</head>
<body>
<div id="boot" class="boot">
  <h1>PakKom Exambro</h1>
  <p>Portal ujian sedang disiapkan.</p>
  <div id="bootStatus" class="boot-status">Memuat aplikasi dan koneksi Firebase…</div>
</div>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" onerror="PAKKOM_BOOT_ERROR('Firebase App gagal dimuat. Pastikan perangkat terhubung ke internet.')"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" onerror="PAKKOM_BOOT_ERROR('Firebase Auth gagal dimuat.')"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" onerror="PAKKOM_BOOT_ERROR('Firebase Firestore gagal dimuat.')"></script>
<script src="config.js" onerror="PAKKOM_BOOT_ERROR('File config.js tidak ditemukan. Pastikan index.html dan config.js berada dalam folder yang sama.')"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js" onerror="PAKKOM_BOOT_ERROR('File app.js tidak ditemukan. Pastikan semua file diunggah bersama.')"></script>
</body>
</html>
