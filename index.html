<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123b70">
  <title>PakKom Exambro V12 Secure</title>
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <div id="boot" class="login card">
    <h1>PakKom Exambro</h1>
    <p class="muted">Memuat sistem ujian…</p>
    <p id="bootMsg" class="smalltext"></p>
  </div>
  <div id="app"></div>

  <script>
    window.PAKKOM_BOOT_ERROR=function(msg){
      var b=document.getElementById('boot');
      if(b){b.innerHTML='<h2>Sistem belum dapat dibuka</h2><div class="error">'+String(msg).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</div><p class="muted">Periksa konfigurasi Firebase atau deployment Cloud Functions.</p>';}
    };
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
